<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-labelledby="title desc">
  <title id="title">Galaxy Watch Helper</title>
  <desc id="desc">A round smartwatch with two side buttons and a wrench on its screen.</desc>

  <!-- Light tonal palette with a primary container background. -->
  <rect width="1024" height="1024" fill="#D6E3FF"/>

  <!-- Watch band. -->
  <rect x="384" y="100" width="244" height="302" rx="88" fill="#657DA6"/>
  <rect x="384" y="622" width="244" height="302" rx="88" fill="#657DA6"/>

  <!-- Watch lugs. -->
  <rect x="350" y="336" width="312" height="96" rx="48" fill="#657DA6"/>
  <rect x="350" y="592" width="312" height="96" rx="48" fill="#657DA6"/>

  <!-- Side buttons follow the upper and lower curves of the case. -->
  <g fill="#415F91">
    <rect x="771" y="314" width="34" height="104" rx="11"
          transform="rotate(-28 788 366)"/>
    <rect x="771" y="606" width="34" height="104" rx="11"
          transform="rotate(28 788 658)"/>
  </g>

  <!-- Round watch case and screen. -->
  <circle cx="506" cy="512" r="306" fill="#415F91"/>
  <circle cx="506" cy="512" r="262" fill="#A8C7FA"/>

  <path fill="#284777" transform="translate(515 521) rotate(-45) scale(11.5)"
        d="M-4.7 -12.6
           Q-4 -13 -4 -12.2 V-7.5 Q-4 -7.1 -3.65 -6.85
           L-0.5 -4.65 Q0 -4.3 0.5 -4.65 L3.65 -6.85
           Q4 -7.1 4 -7.5 V-12.2 Q4 -13 4.7 -12.6
           C7.05 -11.15 8.5 -8.6 8.5 -5.8
           C8.5 -2.3 6.4 0.65 3.3 1.9 V10.7
           A3.3 3.3 0 0 1 -3.3 10.7 V1.9
           C-6.4 0.65 -8.5 -2.3 -8.5 -5.8
           C-8.5 -8.6 -7.05 -11.15 -4.7 -12.6 Z"/>
</svg>

